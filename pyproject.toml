[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pubb"
version = "0.2.0"
description = "Pubb server SDK for Python"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Pubb"}]
keywords = ["pubb", "realtime", "pubsub"]

[project.urls]
Repository = "https://github.com/pubbio/sdk-python"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pubb = ["py.typed"]
